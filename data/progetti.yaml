- id: xfce-dotfiles
  title: "XFCE Dotfiles per PC datati"
  description: "Una configurazione di XFCE4 su Arch Linux pensata per computer vecchi e poco potenti, nata per un HP compact collegato a un monitor VGA. Sistema i problemi tipici dello schermo analogico, come i pulsanti delle finestre tagliati sul bordo destro, e alleggerisce il carico sulla CPU per tenere il sistema reattivo. Parte dal tema del team di EndeavourOS e si applica con un solo script."
