  description: "Una configurazione completa per Hyprland, il gestore a finestre affiancate pensato per essere controllato soprattutto da tastiera, adattata a Fedora Linux e a un portatile ASUS Zenbook 14 OLED. Riprende il lavoro di Riccardo Palombo su Arch Linux e risolve i conflitti che impedivano di tenere installato anche GNOME. Pacchetti e impostazioni si installano con un solo script."
