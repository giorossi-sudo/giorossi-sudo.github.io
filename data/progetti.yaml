  description: "Una configurazione completa per Hyprland, un ambiente desktop a finestre affiancate che si controlla soprattutto da tastiera, adattata a Fedora Linux e a un portatile ASUS Zenbook 14 OLED. Parte dal lavoro di Riccardo Palombo per Arch e lo porta su Fedora, risolvendo i conflitti che impedivano di tenere installato anche GNOME. Uno script installa pacchetti e impostazioni in un solo passaggio."
